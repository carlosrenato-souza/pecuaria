<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

.sync-status{font-size:.6rem;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff}
@media(min-width:500px){body{max-width:480px;margin:0 auto}.bnav{max-width:480px;left:50%;transform:translateX(-50%)}}

<div class="loading" id="loading">🐄 Carregando...</div>

<!-- LOGIN -->
<div class="login-screen" id="login-screen" style="display:none">
  <div class="login-box">
    <div class="login-logo"><div class="ico">🐄</div><h2>Sistema Pecuária</h2><p>Controle de rebanho na nuvem</p></div>

      <div class="login-error" id="login-error"></div>

<!-- APP -->

  <button class="nb" data-p="rebanho"><span class="ico">🐄</span><span class="lbl">Rebanho</span></button>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// FIREBASE CONFIG
firebase.initializeApp({
  apiKey: "AIzaSyCnt9tIiW4ABPrMmyFsNnx4Ja79SozRRJo",
  authDomain: "pecuaria-38e8e.firebaseapp.com",
  projectId: "pecuaria-38e8e",
  storageBucket: "pecuaria-38e8e.firebasestorage.app",
  messagingSenderId: "274817403857",
  appId: "1:274817403857:web:3cb2868f58b7e015562ef0"
});

var auth = firebase.auth();
var db = firebase.firestore();
var currentUser = null;
var D = {gado:[],props:[]};
var isLogin = true;

function $(i){return document.getElementById(i)}
function msg(t){var m=document.createElement('div');m.className='msg';m.textContent=t;document.body.appendChild(m);setTimeout(function(){m.remove()},1500)}

// AUTH
function toggleAuth(){
  isLogin=!isLogin;
  $('auth-btn').textContent=isLogin?'Entrar':'Criar Conta';
  $('auth-toggle-btn').textContent=isLogin?'Criar conta':'Já tenho conta';
  $('auth-toggle-text').innerHTML=isLogin?'Não tem conta? <b>Cadastre-se</b>':'Já tem conta? <b>Entrar</b>';
  $('login-error').classList.remove('on');
}

function authAction(){
  var email=$('auth-email').value.trim();
  var pass=$('auth-pass').value;
  if(!email||!pass){showErr('Preencha e-mail e senha');return}
  $('auth-btn').textContent='Aguarde...';
  if(isLogin){
    auth.signInWithEmailAndPassword(email,pass).catch(function(e){showErr(traduzErro(e.code));$('auth-btn').textContent='Entrar'});
  }else{
    if(pass.length<6){showErr('Senha mínimo 6 caracteres');$('auth-btn').textContent='Criar Conta';return}
    auth.createUserWithEmailAndPassword(email,pass).catch(function(e){showErr(traduzErro(e.code));$('auth-btn').textContent='Criar Conta'});
  }
}

function showErr(t){$('login-error').textContent=t;$('login-error').classList.add('on')}
function traduzErro(code){
  var map={'auth/invalid-email':'E-mail inválido','auth/user-not-found':'Usuário não encontrado','auth/wrong-password':'Senha incorreta','auth/email-already-in-use':'E-mail já cadastrado','auth/weak-password':'Senha muito fraca (mín 6)','auth/invalid-credential':'E-mail ou senha incorretos'};
  return map[code]||'Erro: '+code;
}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&$('login-screen').style.display!=='none')authAction()});

window.doLogout=function(){auth.signOut()};

// AUTH STATE
auth.onAuthStateChanged(function(user){
  $('loading').classList.add('hide');
  if(user){
    currentUser=user;
    $('login-screen').style.display='none';
    $('app').classList.add('on');
    $('hdr-user').textContent=user.email.split('@')[0];
    loadData();
  }else{
    currentUser=null;
    $('login-screen').style.display='flex';
    $('app').classList.remove('on');
    $('auth-btn').textContent=isLogin?'Entrar':'Criar Conta';
  }
});

// FIRESTORE - dados compartilhados (todos veem o mesmo)
function loadData(){
  // Listener em tempo real
  db.collection('gado').onSnapshot(function(snap){
    D.gado=[];
    snap.forEach(function(doc){D.gado.push(Object.assign({id:doc.id},doc.data()))});
    rend(curPg());
  });
  db.collection('props').onSnapshot(function(snap){
    D.props=[];
    snap.forEach(function(doc){D.props.push(Object.assign({id:doc.id},doc.data()))});
    rend(curPg());
  });
}

// CRUD
function addAnimal(obj){return db.collection('gado').add(obj)}
function updAnimal(id,obj){return db.collection('gado').doc(id).update(obj)}
function delAnimalDB(id){return db.collection('gado').doc(id).delete()}
function addProp(obj){return db.collection('props').add(obj)}
function updProp(id,obj){return db.collection('props').doc(id).update(obj)}
function delPropDB(id){return db.collection('props').doc(id).delete()}

// HELPERS
function catIdade(nasc,sexo,esp){if(esp==='Equino')return'Equino';if(!nasc)return sexo==='Fêmea'?'Vaca':'Boi';var m=Math.floor((new Date()-new Date(nasc))/(1000*60*60*24*30.44));if(m<=10)return sexo==='Fêmea'?'Bezerra':'Bezerro';if(m<=14)return sexo==='Fêmea'?'Novilha 1':'Novilho 1';if(m<=24)return sexo==='Fêmea'?'Novilha 2':'Novilho 2';return sexo==='Fêmea'?'Vaca':'Boi'}
function idadeStr(nasc){if(!nasc)return'-';var m=Math.floor((new Date()-new Date(nasc))/(1000*60*60*24*30.44));if(m<1)return'Novo';if(m<12)return m+'m';return Math.floor(m/12)+'a'+(m%12>0?' '+(m%12)+'m':'')}
function gp(pid){var p=D.props.find(function(x){return x.id===pid});return p?p.nome:'-'}
function icoA(a){return(a.especie||'Bovino')==='Equino'?'🐴':a.sexo==='Fêmea'?'🐄':'🐂'}

// NAV
document.querySelectorAll('.nb').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.nb').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on')});$('pg-'+b.dataset.p).classList.add('on');rend(b.dataset.p)})});
function curPg(){var b=document.querySelector('.nb.on');return b?b.dataset.p:'dash'}
function rend(pg){switch(pg){case'dash':rDash();break;case'rebanho':rRebanho();break;case'props':rProps();break}}

// ENTRADA RÁPIDA
window.addEntrada=function(){
  var brinco=prompt('Brinco/Nome:');if(!brinco)return;
  var sexo=prompt('Sexo (Macho/Fêmea):','Macho');
  var especie=prompt('Espécie (Bovino/Equino):','Bovino');
  var raca=prompt('Raça:','Nelore')||'';
  var dono=prompt('Proprietário:','')||'';
  var prop=D.props.length?D.props[0].id:'';
  if(D.props.length>1){var nomes=D.props.map(function(p,i){return(i+1)+'. '+p.nome}).join('\n');var idx=prompt('Propriedade:\n'+nomes,'1');prop=D.props[Number(idx)-1]?D.props[Number(idx)-1].id:D.props[0].id}
  addAnimal({brinco:brinco,sexo:sexo||'Macho',especie:especie||'Bovino',raca:raca,cor:'',peso:0,valor:0,data:new Date().toISOString().slice(0,10),nasc:'',forn:'',dono:dono,prop:prop,desc:'',st:'Ativo',mae:'',pai:''}).then(function(){msg('✓ Animal adicionado!')});
};

window.delAnimal=function(id){if(!window.confirm('Excluir este animal?'))return;delAnimalDB(id).then(function(){msg('Excluído')})};
window.delPropFn=function(id){if(!window.confirm('Excluir propriedade?'))return;delPropDB(id).then(function(){msg('Excluído')})};

window.addPropFn=function(){
  var nome=prompt('Nome da propriedade:');if(!nome)return;
  var tipo=prompt('Tipo (Fazenda/Sítio/Chácara/Pasto Alugado):','Sítio')||'Sítio';
  var dono=prompt('Proprietário:','')||'';
  var local=prompt('Localização:','')||'';
  addProp({nome:nome,tipo:tipo,dono:dono,local:local,obs:''}).then(function(){msg('✓ Propriedade criada!')});
};

// RENDERS
function rDash(){
  var at=D.gado.filter(function(x){return x.st==='Ativo'});
  var bovinos=at.filter(function(a){return(a.especie||'Bovino')==='Bovino'});
  var equinos=at.filter(function(a){return a.especie==='Equino'});
  var h='<div class="tt">Painel</div><div class="stt">Dados em tempo real na nuvem ☁️</div>';
  h+='<div class="sgrid"><div class="sb"><div class="sl">Bovinos</div><div class="sv g">'+bovinos.length+'</div></div><div class="sb"><div class="sl">Equinos</div><div class="sv b">'+equinos.length+'</div></div><div class="sb"><div class="sl">Total</div><div class="sv g">'+at.length+'</div></div><div class="sb"><div class="sl">Propriedades</div><div class="sv gl">'+D.props.length+'</div></div></div>';
  // Por propriedade
  D.props.forEach(function(p){
    var an=at.filter(function(a){return a.prop===p.id});if(!an.length)return;
    var porDono={};an.forEach(function(a){var d=a.dono||'Sem dono';porDono[d]=(porDono[d]||0)+1});
    h+='<div class="cd" style="margin-bottom:6px"><div style="display:flex;justify-content:space-between"><b style="font-size:.76rem">📍 '+p.nome+'</b><span class="bdg bdg-ok">'+an.length+'</span></div><div class="cd-meta" style="margin-top:4px">';
    Object.entries(porDono).forEach(function(e){h+='<span>'+e[0]+': <b>'+e[1]+'</b></span>'});
    h+='</div></div>';
  });
  $('pg-dash').innerHTML=h;
}

var eFilt='',eDonoFilt='';
window.setEF=function(v){eFilt=v;rRebanho()};
window.setDonoFilt=function(el){eDonoFilt=el.value;rRebanho()};
function rRebanho(){
  var at=D.gado.filter(function(x){return x.st==='Ativo'});
  var s=($('srch-e')?$('srch-e').value:'').toLowerCase();
  var list=at.filter(function(a){
    if(eFilt==='Equinos'&&(a.especie||'Bovino')!=='Equino')return false;
    if(eFilt==='Vacas'&&catIdade(a.nasc,a.sexo,a.especie)!=='Vaca')return false;
    if(eFilt==='Bois'&&catIdade(a.nasc,a.sexo,a.especie)!=='Boi')return false;
    if(eFilt&&eFilt!=='Equinos'&&eFilt!=='Vacas'&&eFilt!=='Bois'&&catIdade(a.nasc,a.sexo,a.especie)!==eFilt)return false;
    if(eDonoFilt&&a.dono!==eDonoFilt)return false;
    if(s&&(a.brinco||'').toLowerCase().indexOf(s)<0&&(a.raca||'').toLowerCase().indexOf(s)<0&&(a.dono||'').toLowerCase().indexOf(s)<0)return false;
    return true;
  });
  var donos=[];at.forEach(function(a){if(a.dono&&donos.indexOf(a.dono)<0)donos.push(a.dono)});donos.sort();
  var cats=['','Equinos','Vacas','Bois','Bezerro','Bezerra','Novilho 1','Novilha 1','Novilho 2','Novilha 2'];
  var h='<div class="tt">Rebanho</div><div class="stt">'+at.length+' ativos | mostrando '+Math.min(list.length,50)+'</div>';
  h+='<div class="action-row"><button class="btn btn1" onclick="addEntrada()">+ Entrada</button></div>';
  h+='<input class="srch" id="srch-e" type="text" placeholder="🔍 Buscar brinco, raça, dono..." value="'+s+'" oninput="rRebanho()">';
  h+='<select class="filter-select" onchange="setDonoFilt(this)"><option value="">👤 Todos proprietários</option>';
  donos.forEach(function(d){h+='<option value="'+d+'"'+(eDonoFilt===d?' selected':'')+'>'+d+'</option>'});h+='</select>';
  h+='<div class="chips">';cats.forEach(function(c){h+='<div class="chip'+(eFilt===c?' on':'')+'" onclick="setEF(\''+c+'\')">'+(c||'Todos')+'</div>'});h+='</div>';
  h+='<div class="cl">';
  if(list.length){
    list.slice(0,50).forEach(function(a){
      var cat=catIdade(a.nasc,a.sexo,a.especie);
      h+='<div class="cd"><div class="cd-top"><div class="cd-av">'+icoA(a)+'</div><div class="cd-info"><div class="cd-nm">'+a.brinco+'</div><div class="cd-sub">'+a.raca+' • '+a.sexo+'</div></div><span class="bdg '+(cat==='Equino'?'bdg-eq':'bdg-cat')+'">'+cat+'</span></div>';
      h+='<div class="cd-meta"><span>Dono: <b>'+(a.dono||'-')+'</b></span><span>'+gp(a.prop)+'</span><span>'+idadeStr(a.nasc)+'</span></div>';
      h+='<div class="cd-acts"><button class="btn btn-s btnD" onclick="delAnimal(\''+a.id+'\')">🗑</button></div></div>';
    });
  }else{h+='<div class="empty">Nenhum animal encontrado</div>'}
  h+='</div>';
  $('pg-rebanho').innerHTML=h;
}
window.rRebanho=rRebanho;

function rProps(){
  var h='<div class="tt">Propriedades</div><div class="action-row"><button class="btn btn1" onclick="addPropFn()">+ Nova Propriedade</button></div><div class="cl">';
  if(D.props.length){
    D.props.forEach(function(p){
      var ct=D.gado.filter(function(a){return a.prop===p.id&&a.st==='Ativo'}).length;
      h+='<div class="cd"><div class="cd-top"><div class="cd-av">📍</div><div class="cd-info"><div class="cd-nm">'+p.nome+'</div><div class="cd-sub">'+p.tipo+' • '+(p.local||'-')+'</div></div><span class="bdg bdg-ok">'+ct+'</span></div>';
      h+='<div class="cd-meta"><span>Dono: <b>'+(p.dono||'-')+'</b></span></div>';
      h+='<div class="cd-acts"><button class="btn btn-s btnD" onclick="delPropFn(\''+p.id+'\')">🗑</button></div></div>';
    });
  }else{h+='<div class="empty">Nenhuma propriedade</div>'}
  h+='</div>';$('pg-props').innerHTML=h;
}
</script>
