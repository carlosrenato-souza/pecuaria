<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

window.admCreateUser=function(){
  var email=$('adm-email').value.trim();
  var pass=$('adm-pass').value;
  var nome=$('adm-nome').value.trim();
  if(!email||!pass||!nome){alert('Preencha todos os campos');return}
  if(pass.length<6){alert('Senha mínimo 6 caracteres');return}
  // Cria um segundo app Firebase pra criar usuário sem deslogar o admin
  var secondApp;
  try{secondApp=firebase.app('secondary')}catch(e){secondApp=firebase.initializeApp(firebase.app().options,'secondary')}
  secondApp.auth().createUserWithEmailAndPassword(email,pass).then(function(cred){
    // Salva no Firestore
    fdb.collection('users').doc(cred.user.uid).set({email:email,nome:nome,criadoEm:new Date().toISOString()});
    secondApp.auth().signOut();
    msg('✓ Usuário '+nome+' criado!');
    closeSh('sh-adm-user');
    ['adm-email','adm-pass','adm-nome'].forEach(function(i){$(i).value=''});
  }).catch(function(er){
    alert('Erro: '+(er.message||er.code));
    secondApp.auth().signOut();
  });
};

window.admDelUser=function(uid,email){
  showCfm('Excluir usuário '+email+'?',function(){
    fdb.collection('users').doc(uid).delete().then(function(){msg('Removido do sistema')});

  });
};

    });
  }else{
    h+='<div class="empty">Nenhum usuário cadastrado ainda</div>';
  }
  h+='</div>';
  $('pg-adm').innerHTML=h;
}

// DESPESA
window.editDesp=function(id){editDId=id||null;if(id){var d=DE.find(function(x){return x.id===id});if(!d)return;$('sh-desp-t').textContent='Editar';$('fd-ct').value=d.cat;$('fd-vl').value=d.valor;$('fd-dt').value=d.data;$('fd-ds').value=d.desc||'';setTimeout(function(){$('fd-pr').value=d.prop||''},50)}else{$('sh-desp-t').textContent='Nova Despesa';['fd-vl','fd-dt','fd-ds'].forEach(function(i){$(i).value=''})}openSh('sh-desp')};
window.saveDesp=function(){var v=$('fd-vl').value;if(!v){alert('Preencha');return}var obj={cat:$('fd-ct').value,valor:Number(v),data:$('fd-dt').value||new Date().toISOString().slice(0,10),prop:$('fd-pr').value,desc:$('fd-ds').value};if(editDId){fdb.collection('desp').doc(editDId).update(obj).then(function(){msg('✓');closeSh('sh-desp');editDId=null})}else{fdb.collection('desp').add(obj).then(function(){msg('✓ Salva');closeSh('sh-desp')})}};
window.delD=function(id){showCfm('Deseja realmente excluir?',function(){fdb.collection('desp').doc(id).delete().then(function(){msg('Excluída')})})};

// PROPRIEDADE
window.editProp=function(id){editPId=id||null;if(id){var p=P.find(function(x){return x.id===id});if(!p)return;$('sh-prop-t').textContent='Editar';$('fp-nm').value=p.nome;$('fp-tp').value=p.tipo;$('fp-dn').value=p.dono||'';$('fp-lc').value=p.local||''}else{$('sh-prop-t').textContent='Nova Propriedade';['fp-nm','fp-dn','fp-lc'].forEach(function(i){$(i).value=''})}openSh('sh-prop')};
window.saveProp=function(){var n=$('fp-nm').value;if(!n){alert('Preencha');return}var obj={nome:n,tipo:$('fp-tp').value,dono:$('fp-dn').value,local:$('fp-lc').value};if(editPId){fdb.collection('props').doc(editPId).update(obj).then(function(){msg('✓');closeSh('sh-prop');editPId=null})}else{fdb.collection('props').add(obj).then(function(){msg('✓ Criada');closeSh('sh-prop')})}};
window.delP=function(id){showCfm('Deseja realmente excluir?',function(){fdb.collection('props').doc(id).delete().then(function(){msg('Excluída')})})};

// RENDERS
function rend(pg){switch(pg){case'dash':rDash();break;case'reb':rReb();break;case'vend':rVend();break;case'desp':rDesp();break;case'prop':rProp();break;case'adm':rAdm();break}}

function rDash(){var at=G.filter(function(x){return x.st==='Ativo'}),bov=at.filter(function(a){return(a.especie||'Bovino')==='Bovino'}),eq=at.filter(function(a){return a.especie==='Equino'});var td=DE.reduce(function(s,x){return s+Number(x.valor||0)},0),tv=V.reduce(function(s,v){return s+(v.itens||[]).reduce(function(s2,i){return s2+Number(i.total||0)},0)},0);var h='<div class="tt">Painel</div><div class="stt">☁️ Tempo real</div><div class="sgrid"><div class="sb"><div class="sl">Bovinos</div><div class="sv g">'+bov.length+'</div></div><div class="sb"><div class="sl">Equinos</div><div class="sv b">'+eq.length+'</div></div><div class="sb"><div class="sl">Total</div><div class="sv g">'+at.length+'</div></div><div class="sb"><div class="sl">Vendas</div><div class="sv gl">'+money(tv)+'</div></div></div>';P.forEach(function(p){var an=at.filter(function(a){return a.prop===p.id});if(!an.length)return;var pd={};an.forEach(function(a){var d=a.dono||'?';pd[d]=(pd[d]||0)+1});h+='<div class="cd" style="margin-bottom:6px"><div style="display:flex;justify-content:space-between"><b style="font-size:.72rem">📍 '+p.nome+'</b><span class="bdg bdg-ok">'+an.length+'</span></div><div class="cd-meta" style="margin-top:3px">';Object.entries(pd).forEach(function(e){h+='<span>'+e[0]+': <b>'+e[1]+'</b></span>'});h+='</div></div>'});if(td>0)h+='<div class="section-divider"></div><div class="section-title">💸 Despesas: '+money(td)+'</div>';$('pg-dash').innerHTML=h}

var eF='',eDn='';window.setEF=function(v){eF=v;rReb()};window.setDn=function(el){eDn=el.value;rReb()};
function rReb(){var at=G.filter(function(x){return x.st==='Ativo'}),s=($('sr-r')?$('sr-r').value:'').toLowerCase();var list=at.filter(function(a){if(eF==='Equinos'&&(a.especie||'Bovino')!=='Equino')return false;if(eF==='Vacas'&&catI(a.nasc,a.sexo,a.especie)!=='Vaca')return false;if(eF==='Bois'&&catI(a.nasc,a.sexo,a.especie)!=='Boi')return false;if(eF&&eF!=='Equinos'&&eF!=='Vacas'&&eF!=='Bois'&&catI(a.nasc,a.sexo,a.especie)!==eF)return false;if(eDn&&a.dono!==eDn)return false;if(s&&(a.brinco||'').toLowerCase().indexOf(s)<0&&(a.raca||'').toLowerCase().indexOf(s)<0&&(a.dono||'').toLowerCase().indexOf(s)<0)return false;return true});var donos=[];at.forEach(function(a){if(a.dono&&donos.indexOf(a.dono)<0)donos.push(a.dono)});donos.sort();var cats=['','Equinos','Vacas','Bois','Bezerro','Bezerra','Novilho 1','Novilha 1','Novilho 2','Novilha 2'];var h='<div class="tt">Rebanho</div><div class="stt">'+at.length+' ativos</div><div class="action-row"><button class="btn btn1" onclick="editGado()">+ Entrada</button><button class="btn btn2" onclick="openSh(\'sh-nasc\')">🐣 Nascimento</button><button class="btn btn2" onclick="openSh(\'sh-mov\')">🔄 Transferir</button><button class="btn btnD" onclick="openSh(\'sh-perda\')">⚠️ Perda</button></div><input class="srch" id="sr-r" placeholder="🔍 Buscar..." value="'+s+'" oninput="rReb()"><select class="filter-select" onchange="setDn(this)"><option value="">👤 Todos</option>';donos.forEach(function(d){h+='<option value="'+d+'"'+(eDn===d?' selected':'')+'>'+d+'</option>'});h+='</select><div class="chips">';cats.forEach(function(c){h+='<div class="chip'+(eF===c?' on':'')+'" onclick="setEF(\''+c+'\')">'+(c||'Todos')+'</div>'});h+='</div><div class="cl">';list.slice(0,50).forEach(function(a){var cat=catI(a.nasc,a.sexo,a.especie);h+='<div class="cd"><div class="cd-top"><div class="cd-av">'+icoA(a)+'</div><div class="cd-info"><div class="cd-nm">'+a.brinco+'</div><div class="cd-sub">'+(a.raca||'')+' • '+a.sexo+'</div></div><span class="bdg '+(cat==='Equino'?'bdg-eq':'bdg-cat')+'">'+cat+'</span></div><div class="cd-meta"><span>Dono: <b>'+(a.dono||'-')+'</b></span><span>'+gp(a.prop)+'</span><span>'+idS(a.nasc)+'</span>'+(a.peso?'<span>'+a.peso+'kg</span>':'')+'</div>';if(a.mae||a.pai)h+='<div style="font-size:.58rem;color:#9b59b6;margin-top:2px">👪 Mãe:'+gn(a.mae)+' Pai:'+gn(a.pai)+'</div>';h+='<div class="cd-acts"><button class="btn btn-s btn1" onclick="editGado(\''+a.id+'\')">✏️</button><button class="btn btn-s btnD" onclick="delG(\''+a.id+'\')">🗑</button></div></div>'});if(!list.length)h+='<div class="empty">Nenhum</div>';if(list.length>50)h+='<div class="empty">Mostrando 50 de '+list.length+'</div>';h+='</div>';$('pg-reb').innerHTML=h}
window.rReb=rReb;

function rVend(){var h='<div class="tt">Vendas</div><div class="action-row"><button class="btn btn1" onclick="openSh(\'sh-venda\')">+ Nova Venda</button></div><div class="cl">';if(V.length){V.slice().sort(function(a,b){return(b.data||'')>(a.data||'')?1:-1}).forEach(function(v){var tV=(v.itens||[]).reduce(function(s,i){return s+Number(i.total||0)},0);h+='<div class="cd"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><div><b>'+(v.comp||'-')+'</b><div style="font-size:.6rem;color:var(--mt)">'+fmt(v.data)+' • '+(v.itens||[]).length+' animal(is)</div></div><b style="color:var(--gold)">'+money(tV)+'</b></div><div class="cd-acts"><button class="btn btn-s btn1" onclick="printV(\''+v.id+'\')">🖨</button><button class="btn btn-s btnD" onclick="delV(\''+v.id+'\')">🗑</button></div></div>'})}else h+='<div class="empty">Nenhuma venda</div>';h+='</div>';$('pg-vend').innerHTML=h}

function rDesp(){var h='<div class="tt">Despesas</div><div class="action-row"><button class="btn btn1" onclick="editDesp()">+ Nova</button></div>';var tot=DE.reduce(function(s,d){return s+Number(d.valor||0)},0);if(tot)h+='<div class="sb" style="margin-bottom:10px"><div class="sl">Total</div><div class="sv r">'+money(tot)+'</div></div>';h+='<div class="cl">';if(DE.length){DE.slice().sort(function(a,b){return(b.data||'')>(a.data||'')?1:-1}).forEach(function(d){h+='<div class="cd" style="padding:9px 12px"><div style="display:flex;justify-content:space-between"><div><span class="bdg bdg-ok">'+d.cat+'</span><div style="font-size:.7rem;margin-top:2px">'+(d.desc||'-')+'</div><div style="font-size:.58rem;color:var(--mt)">'+fmt(d.data)+' • '+gp(d.prop)+'</div></div><b style="color:var(--r)">'+money(d.valor)+'</b></div><div class="cd-acts"><button class="btn btn-s btn1" onclick="editDesp(\''+d.id+'\')">✏️</button><button class="btn btn-s btnD" onclick="delD(\''+d.id+'\')">🗑</button></div></div>'})}else h+='<div class="empty">Sem despesas</div>';h+='</div>';$('pg-desp').innerHTML=h}

function rProp(){var h='<div class="tt">Propriedades</div><div class="action-row"><button class="btn btn1" onclick="editProp()">+ Nova</button></div><div class="cl">';P.forEach(function(p){var ct=G.filter(function(a){return a.prop===p.id&&a.st==='Ativo'}).length;h+='<div class="cd"><div class="cd-top"><div class="cd-av">📍</div><div class="cd-info"><div class="cd-nm">'+p.nome+'</div><div class="cd-sub">'+(p.tipo||'')+' • '+(p.local||'')+'</div></div><span class="bdg bdg-ok">'+ct+'</span></div><div class="cd-meta"><span>Dono: <b>'+(p.dono||'-')+'</b></span></div><div class="cd-acts"><button class="btn btn-s btn1" onclick="editProp(\''+p.id+'\')">✏️</button><button class="btn btn-s btnD" onclick="delP(\''+p.id+'\')">🗑</button></div></div>'});if(!P.length)h+='<div class="empty">Nenhuma</div>';h+='</div>';$('pg-prop').innerHTML=h}
</script>
</body>
</html>
